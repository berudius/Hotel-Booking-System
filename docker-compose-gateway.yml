version: '3.8'

services:
  redis-cache:
    image: redis:7-alpine
    container_name: edemium-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - gateway-internal

  api-gateway:
    build:
      context: .
      dockerfile: api.gateway/Dockerfile
    container_name: api-gateway
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/persistent_login_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATA_REDIS_HOST=redis-cache
      - USER_SERVICE_URL=http://demo-user-service:8086
      - BOOKING_SERVICE_URL=http://demo-hotel-service:8087
      - RESOURCE_SERVICE_URL=http://demo-resource-service:8088
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REMEMBER_ME_KEY=${REMEMBER_ME_KEY}
      - DATA_BASE_PASSWORD=${DATA_BASE_PASSWORD}
    networks:
      - gateway-internal
      # - edemium-network 
    depends_on:
      - redis-cache

volumes:
  redis_data:

networks:
  # edemium-network:
  #   external: true
  #   name: edemium-network
  gateway-internal:
    driver: bridge