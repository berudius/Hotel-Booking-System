version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: edemium-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DATA_BASE_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # networks:
    #   - edemium-network

volumes:
  mysql_data:

